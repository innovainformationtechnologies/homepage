<div class="affiliate_container">
    <div class="affiliate_body">
        <h1 class="text1 title">Be The Change You Want To See</h1>

        <div class="flex row center content">
            <img class="affiliate_image" src="static/innova_logo.png" alt="logo">
            <div class="flex col">
                <p id="body">
                    Work with us and help make the internet more independent for everyone. The SheetSite framework is open source and free to use, but you can earn 50% commission by selling templates and components.
                </p>
                <div class="cta">
                    <a class="btn btn-lg btn-primary" id="affiliates">Get Started</a>
                </div>
                <div class="cta">
                    <a class="btn btn-lg btn-secondary" id="manifesto">Learn More</a>
                </div>
            </div>
        </div>
    </div>
    <style>
        .content{
            gap: 8rem;
        }
        .affiliate_image{
            height: 40vh;
            object-fit: cover;
            border-radius: 1rem;
        }
        .affiliate_container{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 10vh auto 0 auto;
        }
        .affiliate_body{
            width: 80vw;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .title{
            font-size: var(--font_size_title) !important;
            text-align: center;
            /* border-bottom: 1px solid var(--text); */
        }
    </style>
    <script>
        (function(){
            function init(data){
                const element = document.getElementById(`${data.id}`)
                element.querySelector("#affiliates").innerText = data.cta
                element.querySelector("#affiliates").href = data.cta_url
                element.querySelector("#body").innerText = data.body
                element.querySelector("#manifesto").href = data.cta2_url
                element.style.setProperty('--font_size_title', `${parseInt(document.body.style.getPropertyValue('--font_size_h1'))*1.5}px`)
                console.log(element.style.getPropertyValue('--font_size_title'))
            }
            window.componentRegistry.register("affiliate", init)
        })()
    </script>
</div>
