Author: Innova Information Technologyies
Args: id, title, body, cta_url, price, image_url
--------------------------------------->

<div class="card_container">
    <div id="card" class="card_body">
        <img class="card_image" src="static/innova_logo.png" alt="service image">
        <h1 class="text1">Service 1: Website Development</h1>
        <p class="text2">
            Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed sit amet nulla eget elit dictum varius. Maecenas risus mi, porta mattis nulla vitae, ultricies lorem.
        </p>
        <div class="cta">
            <a class="btn btn-lg btn-primary" href="mailto:info@example.com">Get in touch</a>
        </div>
    </div>
    <style>
        .card_container{
            max-width: 35rem;
            background-color: var(--text);
            display: flex;
            flex-direction: column;
            justify-content: left;
            align-items: left;
            margin: auto auto;
            border-radius: 1rem;
            transition: all 0.5s ease-in-out;
            &:hover{
                transform: scale(1.08);
            }
        }
        
        .card_body{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: left;
            align-items: left;
            padding: 1rem;
            & > h1{
                color: var(--background) !important;
                font-size: var(--font_size_h2) !important;
            }
            & > p{
                color: var(--background) !important;
                opacity: 80%;
                height: 20rem;
            }
        }
        .card_image{
            /* position: relative; */
            height: 20rem;
            object-fit: cover;
            border-radius: 1rem;
        }
        .cta{
            margin: auto;
        }
        @media screen and (max-width: 1000px) {
            .card_container{
                min-width: 80vw !important;
                max-height: none;
                max-width: none !important;
                &:hover{
                    transform: scale(1.05);
                }
            }
        }
    </style>
    <script>
        (function(){

            function init(data){
                console.log("card data ", data)
                const element = document.getElementById(`${data.id}`)
                element.querySelector(".text1").innerText = data.title
                element.querySelector(".text2").innerText = data.body
                element.querySelector(".cta").querySelector("a").href = data.cta_url
                element.querySelector(".cta").querySelector("a").innerText = data.price
                element.querySelector(".card_image").src = data.image_url
                console.log(window.innerWidth)
                
            }
            

            window.componentRegistry.register("product_card", init)
        })()
    </script>
</div>
