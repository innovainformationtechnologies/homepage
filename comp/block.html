<div class="block_container">
    <div class="block_body">
        <p class="text"></p>
    </div>
    <style>
         .block_container{
            /* width: 80vw; */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 10vh auto;
        }
        .block_body{
            width: 40rem;
            height: auto;
            object-fit: cover;
            border-radius: 1rem;
        }
    </style>
    <script>
        (function(){
            function init(data){
                const element = document.getElementById(`${data.id}`)
                element.querySelector(".text").innerText = data.text
                element.querySelector(".block_body").style.width = data.width
            }

            window.componentRegistry.register("block", init)
        })()
    </script>
</div>
