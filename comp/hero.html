<div class="hero_container">
    <div id="hero" class="hero_body">
            <h1 class="text1 title" id="title">Welcome to Onyx Audio Tech</h1>
            <div class="cta">
                <a class="btn btn-lg btn-primary" id="store">Store</a>
            </div>
            <div class="cta">
                <a class="btn btn-lg btn-secondary" id="affiliates">Work with us</a>
            </div>
    </div>
    <style>
        .hero_container{
            width: 80vw;
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 10vh auto;
        }
        .hero_body{
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            gap: 4rem;
            text-shadow: 0 0 10px var(--background);
        }
        .cta{
            margin: 2rem 0;
            transition: all 0.5s ease-in-out;
            &:hover{
                transform: scale(1.08);
            }
        }
        #hero>.title{
            font-size: var(--font_size_title) !important;
            text-align: center;
        }
    </style>
    <script>
        (function(){
            function init(data){
                const hero = document.getElementById(`${data.id}`)
                console.log("hero data ", data)
                hero.querySelector("#title").innerText = data.tagline
                hero.querySelector("#store").href = data.cta_url
                hero.querySelector("#store").innerText = data.cta1
                hero.querySelector("#affiliates").innerText = data.cta2
                hero.querySelector("#affiliates").href = data.cta2_url
                hero.style.setProperty('--font_size_title', `${parseInt(document.body.style.getPropertyValue('--font_size_h1'))*2}px`)
                console.log(hero.style.getPropertyValue('--font_size_title'))
                let body = hero.querySelector(".hero_body")
                body.style.backgroundImage = `url(${data.bg_image_url})`
                body.style.backgroundSize = "contain"
                body.style.backgroundPosition = "center"
                body.style.backgroundRepeat = "no-repeat"
                body.style.width = "100%"
                body.style.height = "100%" 
                body.style.margin = "0"
            }

            window.componentRegistry.register("hero", init)
        })()
    </script>
</div>
